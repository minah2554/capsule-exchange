<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background glow / shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#4c1d95" flood-opacity="0.35"/>
    </filter>
    
    <!-- Top hemisphere gradient (Fresh Sky Lilac) -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Bottom hemisphere gradient (Vibrant Mystic Purple) -->
    <linearGradient id="bottomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Inner depth shadow -->
    <radialGradient id="depthShade" cx="40%" cy="35%" r="60%">
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Sparkle star gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Capsule Main Group with Filter -->
  <g filter="url(#shadow)">
    <!-- Base Outer Circle (Dark border contour) -->
    <circle cx="32" cy="32" r="26" fill="#4c1d95" opacity="0.15"/>
    
    <!-- Clipping Mask for Capsule Halves -->
    <g>
      <clipPath id="capsuleClip">
        <circle cx="32" cy="32" r="25"/>
      </clipPath>

      <g clip-path="url(#capsuleClip)">
        <!-- Top Half (Upper Dome) -->
        <rect x="7" y="7" width="50" height="25" fill="url(#topGrad)"/>
        
        <!-- Bottom Half (Lower Dome) -->
        <rect x="7" y="32" width="50" height="25" fill="url(#bottomGrad)"/>

        <!-- Middle Seam Ring / Band -->
        <rect x="7" y="30.5" width="50" height="3" fill="#ffffff" opacity="0.95"/>
        <rect x="7" y="33" width="50" height="1" fill="#4c1d95" opacity="0.3"/>

        <!-- 3D Inner Depth Overlay -->
        <circle cx="32" cy="32" r="25" fill="url(#depthShade)"/>
      </g>
    </g>

    <!-- Glossy Highlight (Curved light reflection on top-left) -->
    <path d="M 18 14 A 18 18 0 0 1 40 14 A 20 12 0 0 0 18 24 Z" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="23" cy="20" rx="3.5" ry="2" transform="rotate(-30 23 20)" fill="#ffffff" opacity="0.9"/>

    <!-- Bottom gentle reflection -->
    <ellipse cx="32" cy="53" rx="12" ry="2" fill="#ffffff" opacity="0.3"/>

    <!-- Outline Stroke for Crisp Definition -->
    <circle cx="32" cy="32" r="25" fill="none" stroke="#6d28d9" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Magic Sparkle Stars for Gacha excitement -->
  <!-- Top Right Big Star -->
  <path d="M 48 6 Q 50 12 56 14 Q 50 16 48 22 Q 46 16 40 14 Q 46 12 48 6 Z" fill="url(#starGrad)"/>
  <circle cx="48" cy="14" r="1.5" fill="#ffffff"/>

  <!-- Left Mini Star -->
  <path d="M 10 36 Q 11 40 15 41 Q 11 42 10 46 Q 9 42 5 41 Q 9 40 10 36 Z" fill="url(#starGrad)" opacity="0.9"/>
</svg>
