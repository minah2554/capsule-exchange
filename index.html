<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>두근두근 캡슐샵</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" type="image/svg+xml" href="favicon.svg">
  <style>
    @font-face {
      font-family: 'Goyang';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Goyang.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }

    :root {
      --bg-top: #efe7ff;
      --bg-bottom: #d9c7ff;
      --purple-deep: #6c4bd6;
      --purple-mid: #8f6ef0;
      --lilac: #c9b6ff;
      --ink: #2a1f4d;
      --ink-soft: #6b5f96;
      --gold: #ffd66b;
      --card: #ffffff;
      --notch-color: #dccdfa;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Goyang', "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      background: radial-gradient(circle at 50% 50%, #f6f0ff 0%, #dcd0ff 100%);
      color: var(--ink);
      -webkit-user-select: none;
      user-select: none;
    }

    button,
    input,
    select,
    textarea {
      font-family: 'Goyang', "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    }

    /* ===== Responsive App Container ===== */
    #appFrame {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      box-shadow: 0 20px 60px rgba(60, 30, 110, 0.15);
    }

    @media (min-width: 600px) and (min-height: 700px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #appFrame {
        width: 480px;
        height: 88vh;
        max-height: 880px;
        min-height: 720px;
        border-radius: 32px;
        border: 8px solid rgba(255, 255, 255, 0.65);
        box-shadow: 0 30px 90px rgba(60, 30, 110, 0.28);
      }
    }

    /* Compact layouts for landscape mode on desktops/tablets to prevent clipping and take up 100% screen */
    @media (orientation: landscape) {
      body {
        display: block !important;
        background: none;
      }

      #appFrame {
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
        min-height: 100% !important;
        border-radius: 0 !important;
        border: none !important;
        box-shadow: none !important;
      }

      #lockLabel {
        font-size: 44px !important;
        margin-bottom: 24px !important;
      }

      .machineBody {
        width: 50vh !important;
        max-width: 360px !important;
        padding: 16px 16px 20px !important;
      }

      .machineDome {
        margin-bottom: 12px !important;
      }

      .glassBall {
        width: 48vh !important;
        height: 48vh !important;
        max-width: 360px !important;
        max-height: 360px !important;
      }

      .capsuleBig {
        width: 36vh !important;
        height: 36vh !important;
        max-width: 240px !important;
        max-height: 240px !important;
      }

      .couponCard {
        height: 24vh !important;
        max-height: 180px !important;
      }

      .couponName {
        font-size: 24px !important;
      }

      h1.title {
        font-size: 28px !important;
        margin: 16px 16px 6px !important;
      }

      .resultTitle {
        font-size: 26px !important;
        margin-top: 18px !important;
      }

      .brandFooter {
        padding: 10px 16px !important;
      }

      .resultBottom {
        padding: 10px 20px 16px !important;
      }

      .topbar {
        padding: 12px 22px 4px !important;
      }

      .ticketRow {
        margin: 2px 0 4px !important;
      }

      .bottomArea {
        padding: 0 20px 16px !important;
      }

      .spinBtn {
        padding: 16px !important;
        font-size: 18px !important;
      }
    }

    /* Scaling for short screens to avoid component overlap */
    @media (max-height: 660px) {
      h1.title {
        font-size: 20px !important;
        margin: 12px 16px 4px !important;
      }

      .ticketRow {
        margin: 2px 0 2px !important;
        gap: 12px !important;
      }

      .spinBtn {
        padding: 14px !important;
        font-size: 15px !important;
      }

      .glassBall {
        width: 25vh !important;
        height: 25vh !important;
      }

      .capsuleBig {
        width: 22vh !important;
        height: 22vh !important;
      }

      .couponCard {
        height: 15vh !important;
      }

      .resultTitle {
        font-size: 20px !important;
        margin-top: 6px !important;
      }

      .brandFooter {
        padding: 10px 16px !important;
      }
    }

    /* Content area taking up all space above footer */
    #appContent {
      flex: 1;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    /* ---------- shared ---------- */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 22px 4px;
    }

    .topbarRight {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prizeListBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid rgba(143, 110, 240, 0.35);
      padding: 7px 13px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(108, 75, 214, 0.12);
      font-weight: 700;
      font-size: 13.5px;
      color: #5833b6;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
      outline: none;
    }

    .prizeListBtn:hover {
      background: #ffffff;
      transform: translateY(-1.5px);
      box-shadow: 0 6px 16px rgba(108, 75, 214, 0.22);
      border-color: var(--purple-mid);
      color: var(--purple-deep);
    }

    .prizeListBtn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 6px rgba(108, 75, 214, 0.15);
    }

    .prizeListBtn .icon {
      font-size: 15px;
      line-height: 1;
    }

    @media (max-width: 380px) {
      .prizeListBtn {
        padding: 6px 10px;
        font-size: 12px;
        gap: 4px;
      }
      .ticketBadge {
        padding: 7px 11px !important;
        font-size: 14px !important;
      }
    }

    .backBtn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, .55);
      font-size: 21px;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ticketBadge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(108, 75, 214, .18);
      font-weight: 700;
      font-size: 16px;
      white-space: nowrap;
    }

    .ticketBadge span.icon {
      font-size: 17px;
    }

    /* ===== Prize List Modal ===== */
    .modalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(25, 14, 52, 0.62);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 16px;
    }

    .modalOverlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modalContainer {
      width: 100%;
      max-width: 440px;
      max-height: 82vh;
      background: linear-gradient(175deg, #ffffff 0%, #f9f6ff 100%);
      border-radius: 26px;
      box-shadow: 0 24px 60px rgba(50, 20, 100, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(20px) scale(0.95);
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modalOverlay.active .modalContainer {
      transform: translateY(0) scale(1);
    }

    .modalHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(143, 110, 240, 0.15);
      background: rgba(255, 255, 255, 0.9);
    }

    .modalHeaderTitle {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modalHeaderTitle .modalIcon {
      font-size: 26px;
      line-height: 1;
      filter: drop-shadow(0 2px 6px rgba(108, 75, 214, 0.25));
    }

    .modalHeaderTitle h3 {
      margin: 0;
      font-size: 17.5px;
      font-weight: 800;
      color: #2a1f4d;
      letter-spacing: -0.3px;
    }

    .modalHeaderTitle p {
      margin: 2px 0 0;
      font-size: 12px;
      color: #7c6ca6;
      font-weight: 500;
    }

    .modalCloseBtn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(143, 110, 240, 0.12);
      color: #52379b;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modalCloseBtn:hover {
      background: rgba(143, 110, 240, 0.25);
      transform: rotate(90deg);
    }

    .modalNoticeBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 18px;
      background: linear-gradient(90deg, #f0e9ff, #f7f3ff);
      font-size: 12.5px;
      font-weight: 600;
      color: #55339c;
      border-bottom: 1px solid rgba(143, 110, 240, 0.1);
    }

    .modalNoticeBar .weightBadge {
      background: rgba(108, 75, 214, 0.12);
      color: #5b36bd;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .prizeListContainer {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .prizeCard {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 2px 7px rgba(90, 50, 160, 0.05);
      border: 1px solid rgba(143, 110, 240, 0.14);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .prizeCard:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(90, 50, 160, 0.12);
    }

    /* 등급별 테두리 및 배경 하이라이트 */
    .prizeCard.tier-legendary {
      background: linear-gradient(135deg, #fffcf0 0%, #fff7d6 100%);
      border: 1.5px solid #f59e0b;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.2);
    }

    .prizeCard.tier-epic,
    .prizeCard.tier-bonus {
      background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
      border: 1px solid #c084fc;
    }

    .prizeCard.tier-miss {
      opacity: 0.85;
      background: #fafafa;
      border: 1px dashed #cbd5e1;
    }

    .prizeCardLeft {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .prizeOrder {
      font-size: 12px;
      font-weight: 700;
      color: #948aa8;
      width: 18px;
      text-align: center;
    }

    .prizeEmojiWrap {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: rgba(143, 110, 240, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .tier-legendary .prizeEmojiWrap {
      background: rgba(245, 158, 11, 0.18);
    }

    .prizeTextInfo {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .prizeTitle {
      font-size: 14px;
      font-weight: 700;
      color: #271a47;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prizeMetaRow {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .prizeNoteTag {
      font-size: 11px;
      color: #6f5f94;
      background: rgba(143, 110, 240, 0.08);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    .prizeCardRight {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
      margin-left: 10px;
    }

    .prizeRateBadge {
      font-size: 13.5px;
      font-weight: 800;
      color: #55339c;
      background: #ede8fc;
      padding: 3px 8px;
      border-radius: 8px;
      letter-spacing: -0.2px;
    }

    .tier-legendary .prizeRateBadge {
      color: #b45309;
      background: #fef3c7;
    }

    .tier-epic .prizeRateBadge,
    .tier-bonus .prizeRateBadge {
      color: #7e22ce;
      background: #f3e8ff;
    }

    .tier-miss .prizeRateBadge {
      color: #64748b;
      background: #f1f5f9;
    }

    .prizeWeightText {
      font-size: 10.5px;
      color: #9d92b5;
      font-weight: 600;
    }

    .modalFooter {
      padding: 12px 18px 16px;
      background: #ffffff;
      border-top: 1px solid rgba(143, 110, 240, 0.12);
      display: flex;
      justify-content: center;
    }

    .modalConfirmBtn {
      width: 100%;
      max-width: 220px;
      padding: 11px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--purple-deep), var(--purple-mid));
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(108, 75, 214, 0.28);
      transition: all 0.2s ease;
    }

    .modalConfirmBtn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(108, 75, 214, 0.36);
    }

    .modalConfirmBtn:active {
      transform: scale(0.97);
    }

    h1.title {
      text-align: center;
      font-size: 26px;
      line-height: 1.45;
      font-weight: 800;
      margin: 20px 20px 6px;
      color: var(--ink);
    }

    /* ---------- ball / capsule component (shared look) ---------- */
    .ballDome {
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 32% 24%, rgba(255, 255, 255, .95), rgba(255, 255, 255, .12) 45%, rgba(255, 255, 255, .04) 70%),
        radial-gradient(circle at 50% 62%, #f4eeff, #e2d3ff 72%);
      box-shadow: inset 0 -18px 40px rgba(140, 100, 230, .28), inset 0 16px 30px rgba(255, 255, 255, .9), 0 18px 38px rgba(120, 80, 200, .22);
    }

    .ballField {
      position: absolute;
      inset: 0;
    }

    .capBall {
      position: absolute;
      border-radius: 50%;
      box-shadow: inset -8px -10px 16px rgba(60, 30, 110, .22), inset 6px 8px 14px rgba(255, 255, 255, .85), 0 6px 10px rgba(80, 40, 150, .22);
      overflow: hidden;
      animation: floaty 3.6s ease-in-out infinite;
    }

    .capBall .half {
      position: absolute;
      inset: 0;
    }

    .capBall .halfA {
      background: var(--cA);
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
    }

    .capBall .halfB {
      background: var(--cB);
      clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
    }

    .capBall .seam {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2.5px;
      background: rgba(255, 255, 255, .8);
      transform: translateX(-50%);
    }

    .capBall .gloss {
      position: absolute;
      width: 38%;
      height: 24%;
      top: 13%;
      left: 16%;
      background: rgba(255, 255, 255, .92);
      border-radius: 50%;
      filter: blur(1.5px);
    }

    @keyframes floaty {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-5px) rotate(3deg);
      }
    }

    /* ---------- main screen ---------- */
    .orbWrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .glassBall {
      width: min(260px, 35vh, 60vw);
      height: min(260px, 35vh, 60vw);
      max-width: 300px;
      max-height: 300px;
      min-width: 160px;
      min-height: 160px;
    }

    .glassBall .ballField {
      inset: 6%;
    }

    .ticketRow {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin: 4px 0 6px;
    }

    .ticketRow .label {
      font-size: 14.5px;
      color: var(--ink-soft);
      font-weight: 700;
    }

    /* 기회 횟수 안내 뱃지 */
    .chanceText {
      text-align: center;
      font-size: 14.5px;
      font-weight: 800;
      color: var(--purple-deep);
      background: rgba(108, 75, 214, 0.08);
      padding: 6px 18px;
      border-radius: 999px;
      margin: 0 auto 8px;
      width: fit-content;
      border: 1px solid rgba(108, 75, 214, 0.12);
      animation: chancePulse 2.5s infinite ease-in-out;
    }

    @keyframes chancePulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 2px 8px rgba(108, 75, 214, 0.05);
      }

      50% {
        transform: scale(1.03);
        box-shadow: 0 3px 16px rgba(108, 75, 214, 0.15);
      }
    }

    .stepBtn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #fff;
      font-size: 19px;
      font-weight: 800;
      color: var(--purple-deep);
      box-shadow: 0 3px 8px rgba(108, 75, 214, .15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .tickerWrap {
      overflow: hidden;
      padding: 4px 0 12px;
      flex-shrink: 0;
    }

    .ticker {
      display: flex;
      gap: 10px;
      white-space: nowrap;
      animation: scrollTicker 60s linear infinite;
      width: max-content;
    }

    @keyframes scrollTicker {
      0% {
        transform: translate3d(0, 0, 0);
      }

      100% {
        transform: translate3d(-50%, 0, 0);
      }
    }

    .tickChip {
      background: #fff;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      box-shadow: 0 3px 10px rgba(108, 75, 214, .12);
      flex: 0 0 auto;
    }

    .tickChip b {
      color: var(--purple-deep);
    }

    .bottomArea {
      padding: 0 20px 24px;
      flex-shrink: 0;
    }

    .spinBtn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: var(--ink);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .3px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .spinBtn:active {
      transform: scale(0.98);
    }

    .spinBtn:disabled {
      background: #b7afcf;
      cursor: not-allowed;
    }

    .hintText {
      text-align: center;
      font-size: 12.5px;
      color: var(--ink-soft);
      margin-top: 9px;
    }

    /* ---------- brand footer ---------- */
    .brandFooter {
      width: 100%;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 30;
      text-align: center;
      flex-shrink: 0;
    }

    .footerLogo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      color: var(--purple-deep);
      letter-spacing: 0.8px;
    }

    .logoIcon {
      font-size: 13px;
    }

    .footerRights {
      font-size: 10.5px;
      color: var(--ink-soft);
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    /* ---------- result screen ---------- */
    #screenResult {
      align-items: center;
    }

    .resultTitle {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      margin-top: 34px;
      line-height: 1.5;
      flex-shrink: 0;
    }

    .resultStage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 0;
      perspective: 800px;
    }

    /* 섞기용 원형 통 (결과창 중앙 배치) */
    #resultMixContainer {
      position: absolute;
      z-index: 2;
      width: min(240px, 32vh, 55vw);
      height: min(240px, 32vh, 55vw);
      max-width: 280px;
      max-height: 280px;
      min-width: 150px;
      min-height: 150px;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: scale(0.6);
      opacity: 0;
      pointer-events: none;
    }

    #resultMixContainer.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* 섞기 통 흔들림 - 회오리치듯 강하게 */
    #resultMixContainer.shakingDome {
      animation: domeVortex 0.4s ease-in-out infinite;
    }

    @keyframes domeVortex {
      0% {
        transform: scale(1) rotate(0deg) translate(0, 0);
      }

      25% {
        transform: scale(1.04) rotate(1.5deg) translate(3px, -3px);
      }

      50% {
        transform: scale(1) rotate(0deg) translate(0, 0);
      }

      75% {
        transform: scale(1.04) rotate(-1.5deg) translate(-3px, 3px);
      }

      100% {
        transform: scale(1) rotate(0deg) translate(0, 0);
      }
    }

    /* 미니 섞기 캡슐 - JS rAF 로 위치 직접 계산 (CSS 애니메이션 없음) */
    .mixBall {
      position: absolute;
      border-radius: 50%;

      overflow: hidden;
    }

    .mixBall .half {
      position: absolute;
      inset: 0;
    }

    .mixBall .halfA {
      background: var(--cA);
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
    }

    .mixBall .halfB {
      background: var(--cB);
      clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
    }

    .mixBall .seam {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1.5px;
      background: rgba(255, 255, 255, 0.8);
      transform: translateX(-50%);
    }

    .mixBall .gloss {
      position: absolute;
      width: 38%;
      height: 24%;
      top: 13%;
      left: 16%;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      filter: blur(1px);
    }


    .capsuleBig {
      width: 24vh;
      height: 24vh;
      max-width: 190px;
      max-height: 190px;
      min-width: 130px;
      min-height: 130px;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 60px rgba(190, 150, 255, .7), inset -14px -16px 24px rgba(60, 30, 110, .25), inset 12px 14px 22px rgba(255, 255, 255, .9);
      overflow: hidden;
      animation: capsuleFloat 3s ease-in-out infinite;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .capsuleBig.hide {
      opacity: 0;
      transform: scale(0.6);
      pointer-events: none;
    }

    @keyframes capsuleFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .capsuleBig .half {
      position: absolute;
      inset: 0;
    }

    .capsuleBig .halfA {
      background: linear-gradient(160deg, #ffffff, var(--cA));
      clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
    }

    .capsuleBig .halfB {
      background: linear-gradient(160deg, #ffffff, var(--cB));
      clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
    }

    .capsuleBig .seam {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 3px;
      background: rgba(255, 255, 255, .85);
      transform: translateX(-50%);
    }

    .capsuleBig .gloss {
      position: absolute;
      width: 36%;
      height: 22%;
      top: 12%;
      left: 16%;
      background: rgba(255, 255, 255, .92);
      border-radius: 50%;
      filter: blur(2px);
    }

    .capsuleBig.shaking {
      animation: shake3d .26s ease-in-out infinite;
    }

    @keyframes shake3d {

      0%,
      100% {
        transform: translate(0, 0) rotateY(0deg) rotateZ(0deg);
      }

      25% {
        transform: translate(-6px, 3px) rotateY(-18deg) rotateZ(-4deg);
      }

      75% {
        transform: translate(6px, -3px) rotateY(18deg) rotateZ(4deg);
      }
    }

    .capsuleBig.shuffling {
      animation: shuffleSpin 2.0s cubic-bezier(0.25, 1, 0.25, 1);
    }

    @keyframes shuffleSpin {
      0% {
        transform: scale(1) rotate(0deg);
      }

      15% {
        transform: scale(1.12) rotate(-30deg);
      }

      85% {
        transform: scale(1.15) rotate(1110deg);
      }

      100% {
        transform: scale(1) rotate(1080deg);
      }
    }

    .capsuleBig.burst {
      animation: burstPop .4s ease forwards;
    }

    @keyframes burstPop {
      0% {
        transform: scale(1);
        opacity: 1;

    @keyframes buttonGlowBlink {

    .btnShuffle,

    .btnShuffle:active,

    .btnShuffle:disabled,

    .btnOpenCapsule {

    .btnOpenCapsule:active {
      transform: scale(0.96);

    canvas#fx {

    /* ---------- lock screen : gacha machine ---------- */
    #lockScreen {

    @keyframes titleGlowPulse {

      0%,
      100% {
        text-shadow:
          0 0 8px rgba(255, 255, 255, 0.9),

      50% {
        text-shadow:
          0 0 16px rgba(255, 255, 255, 1),

    .machineBody {
      width: 35vh;
      max-width: 290px;
      min-width: 200px;
      border-radius: 30px;
      padding: 22px 22px 26px;
      background: linear-gradient(165deg, #ffffff, #efe4ff 60%, #e3d4ff);
      box-shadow: 0 22px 46px rgba(108, 75, 214, .3), inset 0 2px 0 rgba(255, 255, 255, .8);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .machineDome {
      width: 100%;
      aspect-ratio: 1/1;
      margin-bottom: 18px;
    }

    .machineDome .ballField {
      inset: 8%;
    }

    /* Blinking mild-glowing slot plate text styling */
    .machineSlotPlate {
      width: 80%;
      background: var(--purple-deep);
      border-radius: 14px;
      padding: 16px 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      position: relative;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, .25);
      overflow: visible;
    }

    .slot {
      width: 60px;
      height: 11px;
      background: var(--ink);
      border-radius: 6px;
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, .5);

      z-index: 2;

    .slotLabel {
      font-size: 14px;
      color: #ffffff;
      font-weight: 700;

      text-shadow: 0 0 4px rgba(255, 255, 255, 0.6);

    @keyframes slotTextBlink {

      0%,
      100% {

    .machineLeg {

    .coin {

      height: 44px;
      border-radius: 50%;

      transform: translateX(-50%) scale(1);

      font-size: 20px;

      align-items: center;

      z-index: 1;

      animation: coinDrop .7s cubic-bezier(.5, 0, .8, 1) forwards;
    }

    @keyframes coinDrop {
      0% {
        opacity: 1;
        top: -64px;
        transform: translateX(-50%) scale(1);
      }

      72% {
        opacity: 1;
        top: 9px;
        transform: translateX(-50%) scale(1);
      }

      88% {
        opacity: 1;
        top: 11px;
        transform: translateX(-50%) scale(.45);
      }

      100% {
        opacity: 0;
        top: 12px;
        transform: translateX(-50%) scale(.1);
      }
    }

    const APP_VERSION = "v1.3";
    /* =========================================================
       상품 목록 (가중치 = 제시된 확률 값을 그대로 사용, 상대비율로 정규화됨)

    ];
    const TOTAL_WEIGHT = PRIZES.reduce((s, p) => s + p.weight, 0);

    // Fisher-Yates array shuffling
    function shufflePrizes() {
      for (let i = PRIZES.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = PRIZES[i];
        PRIZES[i] = PRIZES[j];
        PRIZES[j] = temp;
      }
    }

    function pickPrize() {
      let r = Math.random() * TOTAL_WEIGHT;
      for (const p of PRIZES) {
        if (r < p.weight) return p;
        r -= p.weight;
      }
      return PRIZES[PRIZES.length - 1];
    }

    /* =========================================================
       사운드 (Web Audio API - 외부 파일 없이 합성)
    ========================================================= */
    let actx;
    function audioCtx() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }

    function playSuspense() {
      const ctx = audioCtx();
      const dur = 1.6;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(420, ctx.currentTime + dur);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.09, ctx.currentTime + 0.2);
      for (let t = 0; t < dur; t += 0.12) {
        gain.gain.exponentialRampToValueAtTime(0.11, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.05, ctx.currentTime + t + 0.06);
      }
      gain.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + dur);
    }

    function playWin() {
      const ctx = audioCtx();
      const now = ctx.currentTime;

      // Base chord: C major 9 (C4, E4, G4, B4, D5) -> frequencies: 261.63, 329.63, 392.00, 493.88, 587.33
      const chord = [261.63, 329.63, 392.00, 493.88, 587.33];

      // 1. Warm synthesizer pad chord for rich harmonic background
      chord.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = idx % 2 === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, now);
        osc.detune.setValueAtTime((Math.random() - 0.5) * 8, now);

        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 2.0);
      });

      // 2. Sparkling crystalline arpeggio (magical chime notes)
      const chimeNotes = [523.25, 587.33, 659.25, 783.99, 1046.5, 1174.66, 1318.51, 1567.98];
      chimeNotes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.06);

        gain.gain.setValueAtTime(0, now + idx * 0.06);
        gain.gain.linearRampToValueAtTime(0.08, now + idx * 0.06 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.4);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now + idx * 0.06);
        osc.stop(now + idx * 0.06 + 0.5);
      });

      // 3. Uplifting sweeping swoosh sound
      const sweepOsc = ctx.createOscillator();
      const sweepGain = ctx.createGain();
      sweepOsc.type = 'sine';
      sweepOsc.frequency.setValueAtTime(150, now);
      sweepOsc.frequency.exponentialRampToValueAtTime(800, now + 0.4);

      sweepGain.gain.setValueAtTime(0, now);
      sweepGain.gain.linearRampToValueAtTime(0.1, now + 0.15);
      sweepGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

      sweepOsc.connect(sweepGain);
      sweepGain.connect(ctx.destination);
      sweepOsc.start(now);
      sweepOsc.stop(now + 0.7);
    }

    function playCoin() {
      const ctx = audioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.25);
    }

    // 강렬한 회오리 효과음 - 저음 웅웅 + 딸깍 + 상승 스윕
    function playShuffleSound() {
      const ctx = audioCtx();
      const now = ctx.currentTime;

      // 1. 저음 웅웅거리는 드론 (2초간 지속)
      const droneOsc = ctx.createOscillator();
      const droneGain = ctx.createGain();
      droneOsc.type = 'sawtooth';
      droneOsc.frequency.setValueAtTime(60, now);
      droneOsc.frequency.linearRampToValueAtTime(90, now + 1.0);
      droneOsc.frequency.linearRampToValueAtTime(70, now + 2.0);
      droneGain.gain.setValueAtTime(0, now);
      droneGain.gain.linearRampToValueAtTime(0.12, now + 0.15);
      droneGain.gain.linearRampToValueAtTime(0.10, now + 1.8);
      droneGain.gain.exponentialRampToValueAtTime(0.001, now + 2.1);
      droneOsc.connect(droneGain); droneGain.connect(ctx.destination);
      droneOsc.start(now); droneOsc.stop(now + 2.2);

      // 2. 빠른 딸깍 연타 (50회, 2초)
      for (let i = 0; i < 50; i++) {
        const t = now + i * 0.04;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const pitch = 200 + Math.random() * 600;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch, t);
        osc.frequency.exponentialRampToValueAtTime(pitch * 0.5, t + 0.035);
        gain.gain.setValueAtTime(0.09, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.038);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.04);
      }

      // 3. 점점 상승하는 스윕 (회오리 느낌)
      const swOsc = ctx.createOscillator();
      const swGain = ctx.createGain();
      swOsc.type = 'sine';
      swOsc.frequency.setValueAtTime(100, now);
      swOsc.frequency.exponentialRampToValueAtTime(1200, now + 1.8);
      swGain.gain.setValueAtTime(0, now);
      swGain.gain.linearRampToValueAtTime(0.07, now + 0.3);
      swGain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
      swOsc.connect(swGain); swGain.connect(ctx.destination);
      swOsc.start(now); swOsc.stop(now + 2.1);

      // 4. 중간에 펑! 하는 타격음
      const impOsc = ctx.createOscillator();
      const impGain = ctx.createGain();
      impOsc.type = 'square';
      impOsc.frequency.setValueAtTime(180, now + 0.9);
      impOsc.frequency.exponentialRampToValueAtTime(40, now + 1.1);
      impGain.gain.setValueAtTime(0.18, now + 0.9);
      impGain.gain.exponentialRampToValueAtTime(0.001, now + 1.15);
      impOsc.connect(impGain); impGain.connect(ctx.destination);
      impOsc.start(now + 0.9); impOsc.stop(now + 1.2);
    }

    function vibrate(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); }

    /* =========================================================

    let spinning = false;

    /* 결과 화면용 회오리 궤도 섞기 캡슐 빌더 - JS rAF 로 실제 원형 궤도 */
    function buildResultMixField() {
      // 이전 애니메이션 취소
      if (window._mixAnimId) { cancelAnimationFrame(window._mixAnimId); window._mixAnimId = null; }

      const wrap = document.getElementById('resultMixBalls');
      if (!wrap) return;
      wrap.innerHTML = '';

      // 캡슐통 구슬과 동일한 팔레트 (CAPSULE_COLOR_PAIRS와 동일)
      const capsuleColors = CAPSULE_COLOR_PAIRS;

      // 3개 궤도 레인 (r·size는 컨테이너 대비 0~1 비율)
      const lanes = [
        { r: 0.15, size: 0.23, period: 0.65, count: 3 },  // 내부 (빠름)
        { r: 0.29, size: 0.20, period: 0.95, count: 4 },  // 중간
        { r: 0.40, size: 0.17, period: 1.30, count: 4 },  // 외곽 (느림)
      ];

      let colorIdx = 0;

      const capsules = [];
      lanes.forEach((lane) => {
        for (let i = 0; i < lane.count; i++) {
          const el = document.createElement('div');
          el.className = 'mixBall';
          el.style.width = (lane.size * 100) + '%';
          el.style.height = (lane.size * 100) + '%';
          // 초기 위치 (중심 - 나중에 rAF가 덮어씀)
          el.style.left = '0%';
          el.style.top = '0%';
          const colors = capsuleColors[colorIdx % capsuleColors.length];
          colorIdx++;
          el.style.setProperty('--cA', colors[0]);
          el.style.setProperty('--cB', colors[1]);
          el.innerHTML = '<div class="half halfA"></div><div class="half halfB"></div><div class="seam"></div><div class="gloss"></div>';
          wrap.appendChild(el);

          const startAngle = (2 * Math.PI / lane.count) * i;
          capsules.push({ el, r: lane.r, period: lane.period, startAngle, size: lane.size });
        }
      });

      function animate(ts) {
        const t = ts / 1000;
        capsules.forEach(cap => {
          const angle = cap.startAngle + (2 * Math.PI / cap.period) * t;
          // cx, cy 는 컨테이너 중심(0.5) 기준 0~1 좌표
          const cx = 0.5 + cap.r * Math.cos(angle);
          const cy = 0.5 + cap.r * Math.sin(angle);
          // 캡슐 top-left 위치 (중심에서 size/2 빼기)
          cap.el.style.left = ((cx - cap.size / 2) * 100).toFixed(2) + '%';
          cap.el.style.top = ((cy - cap.size / 2) * 100).toFixed(2) + '%';
        });
        window._mixAnimId = requestAnimationFrame(animate);
      }

      window._mixAnimId = requestAnimationFrame(animate);
    }

    function startSpin() {
      if (spinning) return;
      const againBtn = document.getElementById('btnAgainSpin');
      const isFree = againBtn.dataset.free === '1';
      if (!isFree) {
        if (tickets < 5) return;

      showScreen('screenResult');

      // Setup button views for pre-open interactive state

      const capsule = document.getElementById('capsule');

      stopCanvasLoop();

    function shuffleAction() {
      if (isShuffling || isCapsuleOpened) return;
      isShuffling = true;

      const shuffleBtn = document.querySelector('.btnShuffle');
      const openBtn = document.querySelector('.btnOpenCapsule');
      shuffleBtn.disabled = true;
      openBtn.disabled = true;

      // 큰 캡슐 숨기고, 섞기 통 띄우기
      const capsule = document.getElementById('capsule');
      capsule.classList.add('hide');

      const mixContainer = document.getElementById('resultMixContainer');
      mixContainer.classList.add('show', 'shakingDome');
      buildResultMixField();

      playShuffleSound();
      vibrate([30, 30, 30]);

      const title = document.getElementById('resultTitleText');
      title.innerHTML = "열심히 쿠폰 섞는 중...🌀";

      shufflePrizes();

      setTimeout(() => {
        // 섞기 통 숨기고, 큰 캡슐 다시 띄우기
        mixContainer.classList.remove('show', 'shakingDome');
        if (window._mixAnimId) { cancelAnimationFrame(window._mixAnimId); window._mixAnimId = null; }
        capsule.classList.remove('hide');
        title.innerHTML = "쿠폰이 신나게 섞였습니다! 🍀<br>어서 캡슐을 열어보세요!";

        shuffleBtn.disabled = false;
        openBtn.disabled = false;
        isShuffling = false;
      }, 2000);
    }

    function shuffleResultAction() {
      if (isShuffling) return;

      // ★ 버그 수정: 결과 후 다시 섞기도 5장 차감 (뽑기 기회 추가 방지)
      const isFreeRetry = document.getElementById('btnAgainSpin').dataset.free === '1';
      if (!isFreeRetry) {
        if (tickets < 5) return;  // 티켓 부족 시 막음
        tickets -= 5;
        renderTickets();
      }
      document.getElementById('btnAgainSpin').dataset.free = '0';

      // Hide coupon card
      const card = document.getElementById('resultCard');
      card.classList.remove('show');

      // Reset capsule visibility to hidden state for shuffle transition
      const capsule = document.getElementById('capsule');
      capsule.className = 'capsuleBig hide';
      capsule.style.opacity = '';
      capsule.style.transform = '';

      // 섞기 통 띄우기
      const mixContainer = document.getElementById('resultMixContainer');
      mixContainer.classList.add('show', 'shakingDome');
      buildResultMixField();

      isCapsuleOpened = false;
      isShuffling = true;

      // Show pre-open buttons, hide final result buttons
      const shuffleBtn = document.querySelector('.btnShuffle');
      const openBtn = document.querySelector('.btnOpenCapsule');
      shuffleBtn.disabled = true;
      openBtn.disabled = true;

      document.getElementById('preOpenButtons').style.display = 'flex';
      document.getElementById('resultButtons').style.display = 'none';

      // Update status title
      const title = document.getElementById('resultTitleText');
      title.innerHTML = "열심히 쿠폰 섞는 중...🌀";

      // Audio/Vibration
      playShuffleSound();
      vibrate([30, 30, 30]);

      // Shuffle array
      shufflePrizes();

      // Stop continuous canvas animations
      stopCanvasLoop();

      setTimeout(() => {
        // 섞기 통 숨기고, 큰 캡슐 다시 띄우기
        mixContainer.classList.remove('show', 'shakingDome');
        if (window._mixAnimId) { cancelAnimationFrame(window._mixAnimId); window._mixAnimId = null; }
        const colors = randomCapsuleColors();
        capsule.style.setProperty('--cA', colors[0]);
        capsule.style.setProperty('--cB', colors[1]);
        capsule.classList.remove('hide');
        title.innerHTML = "쿠폰이 신나게 섞였습니다! 🍀<br>어서 캡슐을 열어보세요!";

        shuffleBtn.disabled = false;
        openBtn.disabled = false;
        isShuffling = false;
      }, 2000);
    }

    function capsuleTapOpen() {
      if (isShuffling || isCapsuleOpened) return;
      isCapsuleOpened = true;

      // Hide pre-open button overlay immediately
      document.getElementById('preOpenButtons').style.display = 'none';

      const capsule = document.getElementById('capsule');
      capsule.className = 'capsuleBig shaking';

      const title = document.getElementById('resultTitleText');
      title.innerHTML = "두근두근... 과연 결과는?";

      vibrate([40, 60, 40, 60, 120]);
      playSuspense();

      setTimeout(() => {
        const prize = pickPrize();
        capsule.className = 'capsuleBig burst';
        vibrate([15, 40, 15, 40, 200]);
        playWin();

        // Start canvas particle looping system
        startCanvasLoop();
        launchConfetti();

        setTimeout(() => {
          capsule.style.opacity = 0;

          const card = document.getElementById('resultCard');
          const eyebrow = document.getElementById('resultEyebrow');
          const emojiEl = document.getElementById('resultEmoji');
          const nameEl = document.getElementById('resultName');

          emojiEl.textContent = prize.emoji;

          // 꽝/당첨 텍스트 분기 처리
          if (prize.name === "꽝") {
            eyebrow.textContent = "아쉬워요... 😢";
            nameEl.textContent = "아쉽지만 다음 기회에! 꽝!";
          } else {
            eyebrow.textContent = "🎉 축하해요! 당첨 쿠폰";
            nameEl.textContent = prize.name;
          }
          card.classList.add('show');

          // Reveal final option buttons
          document.getElementById('resultButtons').style.display = 'flex';

          const againBtn = document.getElementById('btnAgainSpin');
          if (prize.name === "한 번 더 뽑기") {
            againBtn.textContent = "무료 재도전";
            againBtn.dataset.free = '1';
          } else {
            againBtn.textContent = "한 번 더 열기";
            againBtn.dataset.free = '0';
          }

          // 한 번 더 뽑기 버튼 비활성화 상태 갱신
          refreshResultAgainBtn();

          spinning = false;
        }, 420);
      }, 1650);
    }

    function closeResult() {
      // If they didn't open the capsule yet, refund the tickets!
      if (!isCapsuleOpened) {
        const againBtn = document.getElementById('btnAgainSpin');
        const isFree = againBtn.dataset.free === '1';
        if (!isFree && spinning) {
          tickets += 5;
          renderTickets();
        }
      }
      showScreen('screenMain');
      stopCanvasLoop();
      spinning = false;
      isCapsuleOpened = false;
      isShuffling = false;
    }

    /* =========================================================
       컨페티 & Ambient Sparkle 시스템 (canvas)
    ========================================================= */
    let particles = [];
    let canvasAnimId = null;
    let canvasLoopActive = false;

    function initCanvasFX() {
      const canvas = document.getElementById('fx');
      if (!canvas) return;
      const stage = document.getElementById('screenResult').getBoundingClientRect();
      canvas.width = stage.width;
      canvas.height = stage.height;
    }

    // Draw a beautiful star shape with glow
    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, color, alpha) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      let step = Math.PI / spikes;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.globalAlpha = alpha;

      // Outer glowing aura
      ctx.shadowColor = color;
      ctx.shadowBlur = 8;

      ctx.fill();
      ctx.restore();
    }

    function launchConfetti() {
      const canvas = document.getElementById('fx');
      if (!canvas) return;
      if (canvas.width === 0 || canvas.height === 0) {
        initCanvasFX();
      }
      const colors = ['#8f6ef0', '#5cc7f2', '#ffd66b', '#ff9ecf', '#b6f0c9'];
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // 1. Explosion burst: standard squares
      for (let i = 0; i < 60; i++) {
        particles.push({
          type: 'rect',
          x: centerX,
          y: centerY,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 1.3) * 12,
          size: 4 + Math.random() * 6,
          color: colors[i % colors.length],
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.4,
          life: 0,
          maxLife: 80 + Math.random() * 40
        });
      }

      // 2. Explosion burst: shiny stars
      const starColors = ['#ffd66b', '#ffed9e', '#ffffff'];
      for (let i = 0; i < 25; i++) {
        particles.push({
          type: 'star',
          x: centerX,
          y: centerY,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 1.1) * 10,
          size: 6 + Math.random() * 8,
          color: starColors[i % starColors.length],
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.2,
          life: 0,
          maxLife: 90 + Math.random() * 30
        });
      }
    }

    function startCanvasLoop() {
      if (canvasLoopActive) return;
      canvasLoopActive = true;

      const canvas = document.getElementById('fx');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function updateFrame() {
        if (!canvasLoopActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Spawn ambient floating sparkles around/behind the card
        if (Math.random() < 0.12) {
          const colors = ['#ffd66b', '#ffffff', '#c9b6ff', '#eaf6ff'];
          particles.push({
            type: 'sparkle',
            x: 40 + Math.random() * (canvas.width - 80),
            y: canvas.height * 0.65 + (Math.random() - 0.5) * 60,
            vx: (Math.random() - 0.5) * 1.5,
            vy: -0.8 - Math.random() * 1.5,
            size: 3 + Math.random() * 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rot: Math.random() * Math.PI,
            vr: (Math.random() - 0.5) * 0.05,
            life: 0,
            maxLife: 120 + Math.random() * 60
          });
        }

        // Update and draw all particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life++;

          if (p.life >= p.maxLife) {
            particles.splice(i, 1);
            continue;
          }

          // Burst elements fall, ambient sparkles float up
          if (p.type === 'rect' || p.type === 'star') {
            p.vy += 0.32;
            p.vx *= 0.98;
          } else {
            p.vx += Math.sin(p.life * 0.05) * 0.02; // Sway
          }

          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;

          const alpha = Math.max(0, 1 - (p.life / p.maxLife));

          if (p.type === 'rect') {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          } else if (p.type === 'star') {
            drawStar(ctx, p.x, p.y, 5, p.size, p.size * 0.4, p.color, alpha);
          } else if (p.type === 'sparkle') {
            drawStar(ctx, p.x, p.y, 4, p.size, p.size * 0.25, p.color, alpha);
          }
        }

        canvasAnimId = requestAnimationFrame(updateFrame);
      }

      canvasAnimId = requestAnimationFrame(updateFrame);
    }

    function stopCanvasLoop() {
      canvasLoopActive = false;
      if (canvasAnimId) {
        cancelAnimationFrame(canvasAnimId);
        canvasAnimId = null;
      }
      particles = [];
      const canvas = document.getElementById('fx');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    /* =========================================================
       비밀 입장 장치 (화면에 안내 문구 없이 동작)
    ========================================================= */
    let gateTaps = 0, gateTimer = null;
    document.getElementById('lockLabel').addEventListener('click', function () {
      gateTaps++;
      clearTimeout(gateTimer);
      gateTimer = setTimeout(() => { gateTaps = 0; }, 2200);
      if (gateTaps >= 5) {
        gateTaps = 0;
        dropCoin();
      }
    });

    function dropCoin() {
      const plate = document.querySelector('.machineSlotPlate');
      const coin = document.createElement('div');
      coin.className = 'coin drop';
      coin.textContent = '🪙';
      plate.appendChild(coin);
      playCoin();
      vibrate(30);
      coin.addEventListener('animationend', () => {
        coin.remove();
        unlockApp();
      });
    }

    function unlockApp() {
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      showScreen('screenMain');
      vibrate([20, 30, 20]);
    }

    /* =========================================================
       상품 목록 및 확률 모달 제어
    ========================================================= */
    function renderPrizeList() {
      const container = document.getElementById('prizeListContainer');
      if (!container) return;
      container.innerHTML = '';

      PRIZES.forEach((item, idx) => {
        const rate = ((item.weight / TOTAL_WEIGHT) * 100).toFixed(2);
        const card = document.createElement('div');
        card.className = `prizeCard tier-${item.tier || 'common'}`;

        card.innerHTML = `
          <div class="prizeCardLeft">
            <span class="prizeOrder">${idx + 1}</span>
            <div class="prizeEmojiWrap">${item.emoji}</div>
            <div class="prizeTextInfo">
              <span class="prizeTitle">${item.name}</span>
              <div class="prizeMetaRow">
                <span class="prizeNoteTag">${item.note || '보상'}</span>
              </div>
            </div>
          </div>
          <div class="prizeCardRight">
            <span class="prizeRateBadge">${rate}%</span>
            <span class="prizeWeightText">가중치 ${item.weight}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openPrizeModal() {
      const overlay = document.getElementById('prizeModalOverlay');
      if (!overlay) return;
      renderPrizeList();
      overlay.classList.add('active');
      vibrate(15);
    }

    function closePrizeModal() {
      const overlay = document.getElementById('prizeModalOverlay');
      if (overlay) overlay.classList.remove('active');
    }

    function handleModalBackdropClick(e) {
      if (e.target.id === 'prizeModalOverlay') {
        closePrizeModal();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePrizeModal();
    });

    /* =========================================================
       화면 비율 자동 맞춤 - 어떤 기기/PC에서도 잘리지 않게 프레임을 축소·확대
    ========================================================= */
    function fitFrame() {
      initCanvasFX();
    }
    window.addEventListener('resize', fitFrame);
    window.addEventListener('orientationchange', fitFrame);
    fitFrame();

    /* =========================================================
       초기화
    ========================================================= */
    buildBallField('lockBallField');
    buildBallField('orbBalls');
    buildTicker();
    renderTickets();
    renderPrizeList();
    document.getElementById('app').style.display = 'none';
  </script>
</body>
